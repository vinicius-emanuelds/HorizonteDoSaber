services:
  postgres:
    image: postgres:16-alpine
    container_name: siga-postgres
    environment:
      POSTGRES_DB: sigadb
      POSTGRES_USER: siga
      POSTGRES_PASSWORD: siga123
    ports:
      - "5432:5432"
    volumes:
      - siga-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siga -d sigadb"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: siga-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sigadb
      SPRING_DATASOURCE_USERNAME: siga
      SPRING_DATASOURCE_PASSWORD: siga123
      SPRING_JPA_HIBERNATE_DDL_AUTO: create
      JWT_SECRET: c2lnYS10Y2MtMjAyNi1zZWNyZXQta2V5LW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHM=
      JWT_EXPIRATION: 1800000
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  siga-pgdata:
