spring.application.name=siga
spring.config.import=optional:file:.env[.properties]

# PostgreSQL — credenciais lidas de variáveis de ambiente (nunca hardcoded)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sigadb}
spring.datasource.username=${DB_USERNAME:siga}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA — create para limpar schema antigo e rodar o DataInitializer
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT — 30 minutos (1800000 ms) conforme requisito
# Segredo lido de variável de ambiente — NUNCA hardcode aqui
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:1800000}

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Actuator — health básico público, detalhes só para autenticados
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# OpenAPI / Swagger — desabilitado por padrão (habilitar apenas em dev)
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# CORS — origens permitidas (separadas por vírgula)
cors.allowed-origins=${CORS_ORIGINS:http://localhost:8080}
