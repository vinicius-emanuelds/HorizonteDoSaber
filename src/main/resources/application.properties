spring.application.name=siga

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/sigadb
spring.datasource.username=siga
spring.datasource.password=siga123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA — create para limpar schema antigo e rodar o DataInitializer
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT — 30 minutos (1800000 ms) conforme requisito
jwt.secret=c2lnYS10Y2MtMjAyNi1zZWNyZXQta2V5LW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHM=
jwt.expiration=1800000

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
