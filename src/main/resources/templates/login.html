<!DOCTYPE html>
<!-- Modelo do login -->
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIGA Horizonte do Saber</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link href="/css/style.css" rel="stylesheet">
</head>

<body>
    <div class="login-page">
        <div class="login-left">
            <div style="margin-bottom: 24px">
                <i class="bi bi-mortarboard-fill" style="font-size: 64px; opacity: 0.9"></i>
            </div>
            <h1>Horizonte do Saber</h1>
            <p>Sistema Integrado de Gestão Acadêmica<br>
                Escola de Ensino Fundamental • Desde 2005</p>
            <div style="margin-top: 40px; display: flex; gap: 32px; opacity: 0.6; font-size: 13px">
                <span><i class="bi bi-people me-1"></i> 280 Alunos</span>
                <span><i class="bi bi-person-badge me-1"></i> 24 Funcionários</span>
                <span><i class="bi bi-building me-1"></i> 1º ao 5º Ano</span>
            </div>
        </div>
        <div class="login-right">
            <div class="login-card">
                <h2>Entrar no Sistema</h2>
                <p class="subtitle">Insira suas credenciais de acesso</p>

                <div class="login-error" id="loginError"></div>

                <form id="loginForm" onsubmit="return realizarLogin(event)">
                    <div class="mb-3">
                        <label class="form-label">Usuário</label>
                        <div class="input-group">
                            <span class="input-group-text" style="border-radius: 10px 0 0 10px; border-right: none">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" class="form-control" id="loginInput" placeholder="Digite seu login"
                                required style="border-radius: 0 10px 10px 0; border-left: none">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text" style="border-radius: 10px 0 0 10px; border-right: none">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" class="form-control" id="senhaInput" placeholder="Digite sua senha"
                                required style="border-radius: 0 10px 10px 0; border-left: none">
                        </div>
                    </div>
                    <button type="submit" class="btn-login" id="btnLogin">
                        <span id="btnLoginText">Entrar</span>
                        <span id="btnLoginSpinner" class="spinner-border spinner-border-sm" style="display:none"></span>
                    </button>
                </form>

                <div style="text-align: center; margin-top: 24px; font-size: 12px; color: var(--text-muted)">
                    SIGA v2.0 • Horizonte do Saber © 2026
                </div>
            </div>
        </div>
    </div>
    <script>
        async function realizarLogin(e) {
            e.preventDefault();
            const errDiv = document.getElementById('loginError');
            const btn = document.getElementById('btnLogin');
            const btnText = document.getElementById('btnLoginText');
            const spinner = document.getElementById('btnLoginSpinner');
            errDiv.style.display = 'none';
            btn.disabled = true;
            btnText.textContent = 'Entrando...';
            spinner.style.display = 'inline-block';

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        login: document.getElementById('loginInput').value,
                        senha: document.getElementById('senhaInput').value
                    })
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.message || 'Credenciais inválidas');
                }
                const data = await res.json();
                localStorage.setItem('token', data.token);
                localStorage.setItem('role', data.role);
                localStorage.setItem('login', data.login);
                localStorage.setItem('nome', data.nome);
                localStorage.setItem('primeiroAcesso', data.primeiroAcesso);

                // Salva também em cookie para que o browser envie nas navegações de página
                setCookieJwt(data.token);

                btnText.textContent = 'Autenticado! Redirecionando...';
                btn.classList.add('btn-success');

                setTimeout(() => {
                    window.location.href = '/';
                }, 500);
            } catch (err) {
                errDiv.textContent = err.message;
                errDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btnText.textContent = 'Entrar';
                spinner.style.display = 'none';
            }
        }
        // Se já tem token, redireciona
        if (localStorage.getItem('token')) window.location.href = '/';

        // Exibe aviso de sessão expirada quando redirecionado pelo auth.js
        const params = new URLSearchParams(window.location.search);
        if (params.get('expired') === '1') {
            const errDiv = document.getElementById('loginError');
            errDiv.innerHTML = '<i class="bi bi-clock-history me-2"></i>Sua sessão expirou. Por favor, faça login novamente.';
            errDiv.style.display = 'block';
            errDiv.style.backgroundColor = '#fff3cd';
            errDiv.style.color = '#856404';
            errDiv.style.borderColor = '#ffc107';
        }
        /**
 * auth.js — Interceptor global de autenticação JWT.
 */

        // ─── Gerenciamento de cookie ──────────────────────────────────────────────────

        /**
         * Salva o JWT em cookie com validade de 1 dia.
         * O browser envia este cookie automaticamente em toda navegação de página,
         * permitindo que o JwtAuthFilter autentique requisições SSR.
         */
        function setCookieJwt(token) {
            const expira = new Date();
            expira.setTime(expira.getTime() + (24 * 60 * 60 * 1000));
            document.cookie = [
                'jwt=' + token,
                'expires=' + expira.toUTCString(),
                'path=/',
                'SameSite=Strict'
            ].join('; ');
        }

        // ─── Headers para chamadas fetch ─────────────────────────────────────────────

        function authHeaders(extra = {}) {
            const token = localStorage.getItem('token');
            return {
                'Content-Type': 'application/json',
                ...(token ? { 'Authorization': 'Bearer ' + token } : {}),
                ...extra
            };
        }

        // ─── Wrapper fetch com interceptação 401/403 ─────────────────────────────────

        async function apiFetch(url, opts = {}) {
            const options = {
                ...opts,
                headers: {
                    ...authHeaders(),
                    ...(opts.headers || {})
                }
            };

            let response;
            try {
                response = await fetch(url, options);
            } catch (err) {
                throw err;
            }

            if (response.status === 401 || response.status === 403) {
                logout(true);
                throw new Error('Sessão expirada ou sem permissão. Redirecionando para login...');
            }

            return response;
        }

        // ─── Logout ──────────────────────────────────────────────────────────────────

        function logout(expired = false) {
            localStorage.removeItem('token');
            localStorage.removeItem('usuario');
            localStorage.removeItem('role');
            localStorage.removeItem('login');
            localStorage.removeItem('nome');
            localStorage.removeItem('primeiroAcesso');

            // Remove o cookie jwt para que o backend não reconheça mais a sessão
            document.cookie = 'jwt=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; SameSite=Strict';

            window.location.href = '/login' + (expired ? '?expired=1' : '');
        }
    </script>
</body>

</html>
