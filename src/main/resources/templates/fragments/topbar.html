<!-- Fragmento da barra superior -->
<div class="topbar" th:fragment="topbar">
    <div class="page-title" th:text="${pageTitle}">Dashboard</div>
    <div class="user-info">
        <div>
            <div class="user-name" id="topbarUserName">Carregando...</div>
            <div class="user-role" id="topbarUserRole"></div>
        </div>
        <div class="user-avatar" id="topbarUserAvatar">?</div>
    </div>
    <script>
        window.addEventListener('load', function () {
            const token = localStorage.getItem('token');
            if (!token && window.location.pathname !== '/login') {
                window.location.replace('/login');
                return;
            }

            // Guarda de troca de senha obrigatória — intercepta QUALQUER página interna
            if (window.location.pathname !== '/trocar-senha') {
                const primeiroAcesso = localStorage.getItem('primeiroAcesso') === 'true';
                const senhaExpirada  = localStorage.getItem('senhaExpirada')  === 'true';
                if (primeiroAcesso) {
                    window.location.replace('/trocar-senha?obrigatorio=1');
                    return;
                }
                if (senhaExpirada) {
                    window.location.replace('/trocar-senha?expirada=1');
                    return;
                }
            }

            const nome  = localStorage.getItem('nome');
            const login = localStorage.getItem('login');
            const finalNome = (nome && nome !== 'null') ? nome : ((login && login !== 'null') ? login : 'Usuário');
            const role  = localStorage.getItem('role') || '';
            const roleLabels = { 'ADMIN': 'Administrador', 'COORDENADOR': 'Coordenador', 'OPERADOR': 'Operador', 'PROFESSOR': 'Professor' };

            document.getElementById('topbarUserName').textContent = finalNome;
            document.getElementById('topbarUserRole').textContent = roleLabels[role] || role;
            document.getElementById('topbarUserAvatar').textContent = finalNome.charAt(0).toUpperCase();
        });
    </script>
</div>
