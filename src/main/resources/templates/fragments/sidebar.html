Fragmento da Sidebar
<div th:fragment="sidebar">
    <button class="sidebar-toggle" id="sidebarToggle">&#9776;</button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <nav class="sidebar">
        <div class="brand">
            <div class="brand-icon"><i class="bi bi-mortarboard-fill"></i></div>
            <div class="brand-text">
                <h5>SIGA</h5>
                <small>Horizonte do Saber</small>
            </div>
        </div>
        <div>
        <div class="nav-section" >Principal</div>
        <ul class="nav flex-column">
            <li><a class="nav-link" href="/" id="nav-home"><i class="bi bi-grid-1x2"></i> Dashboard</a></li>
        </ul>

        <div class="nav-section" th:if="${isAdmin || isCoordenador || isOperador}">Acadêmico</div>
        <ul class="nav flex-column" th:if="${isAdmin || isCoordenador || isOperador}">
            <li th:if="${isAdmin || isCoordenador || isOperador}"><a class="nav-link" href="/aluno" id="nav-aluno"><i class="bi bi-people"></i> Alunos</a></li>
            <li th:if="${isAdmin || isCoordenador}"><a class="nav-link" href="/professor" id="nav-professor"><i class="bi bi-person-badge"></i>
                    Professores</a></li>
            <li th:if="${isAdmin || isCoordenador}"><a class="nav-link" href="/disciplina" id="nav-disciplina"><i class="bi bi-journal-bookmark"></i>
                    Disciplinas</a></li>
            <li th:if="${isAdmin || isCoordenador}"><a class="nav-link" href="/turma" id="nav-turma"><i class="bi bi-columns-gap"></i> Turmas</a></li>
            <li th:if="${isAdmin || isCoordenador}"><a class="nav-link" href="/modelos-grade" id="nav-modelos-grade"><i class="bi bi-grid-3x3-gap"></i> Modelos de Grade</a></li>
            <li th:if="${isAdmin || isCoordenador || isOperador}"><a class="nav-link" href="/matricula" id="nav-matricula"><i class="bi bi-card-checklist"></i>
                    Matrículas</a></li>
        </ul>

        <div class="nav-section" th:if="${isAdmin || isCoordenador || isProfessor || isOperador}">Pedagógico</div>
        <ul class="nav flex-column" th:if="${isAdmin || isCoordenador || isProfessor || isOperador}">
            <li th:if="${isAdmin || isCoordenador || isProfessor}"><a class="nav-link" href="/nota" id="nav-nota"><i class="bi bi-clipboard-data"></i> Notas</a></li>
            <li th:if="${isAdmin || isCoordenador || isProfessor}"><a class="nav-link" href="/frequencia" id="nav-frequencia"><i class="bi bi-calendar-check"></i>
                    Frequência</a></li>
            <li th:if="${isAdmin || isCoordenador || isOperador}"><a class="nav-link" href="/relatorios" id="nav-relatorios"><i class="bi bi-file-earmark-pdf"></i>
                    Relatórios</a></li>
        </ul>

        <div class="nav-section" th:if="${isAdmin}">Administração</div>
        <ul class="nav flex-column" th:if="${isAdmin}">
            <li><a class="nav-link" href="/ano-letivo" id="nav-ano-letivo">
                    <i class="bi bi-calendar2-range"></i> Ano Letivo
                </a></li>
            <li><a class="nav-link" href="/usuario" id="nav-usuario">
                    <i class="bi bi-shield-lock"></i> Usuários
                </a></li>
        </ul>
        </div>
        <div style="flex:1; margin-top: 12px;"></div>
        <div>
            <button class="btn btn-danger w-100 d-flex align-items-center justify-content-center gap-2"
                onclick="logout()" style="box-shadow: 0 4px 6px rgba(0,0,0,0.1)">
                <i class="bi bi-box-arrow-left"></i> Sair do Sistema
            </button>
        </div>
    </nav>

    <script>
        // Highlight active nav link
        document.addEventListener('DOMContentLoaded', () => {
            const path = window.location.pathname;
            document.querySelectorAll('.sidebar .nav-link').forEach(link => {
                if (link.getAttribute('href') === path) link.classList.add('active');
            });
        });

        function logout() {
            localStorage.clear();
            window.location.replace('/login');
        }
        const toggle = document.getElementById('sidebarToggle');
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.getElementById('sidebarOverlay');

        function openSidebar() {
            sidebar.classList.add('open');
            overlay.classList.add('active');
            toggle.innerHTML = '&#10005;';
        }

        function closeSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
            toggle.innerHTML = '&#9776;';
        }

        toggle.addEventListener('click', () => {
            sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
        });

        overlay.addEventListener('click', closeSidebar);
    </script>
</div>
