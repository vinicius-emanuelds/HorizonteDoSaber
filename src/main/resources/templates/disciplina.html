<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout :: layout(content=~{::content}, pageTitle=${pageTitle})}">
<body><div th:fragment="content">
    <div class="data-card">
        <div class="card-header-custom">
            <h5><i class="bi bi-journal-bookmark me-2"></i>Gestão de Disciplinas</h5>
            <div class="d-flex gap-2"><div class="search-bar"><i class="bi bi-search"></i>
                <input type="text" id="campoBusca" placeholder="Buscar disciplina..." onkeyup="buscar()">
            </div>
            <button class="btn-primary-custom" onclick="abrirModal()"><i class="bi bi-plus-lg"></i> Nova Disciplina</button></div>
        </div>
        <table class="table"><thead><tr><th>Código</th><th>Descrição</th><th>Carga Horária</th><th>Status</th><th>Ações</th></tr></thead>
        <tbody id="lista"><tr><td colspan="5" class="text-center py-4"><div class="spinner-border text-primary"></div></td></tr></tbody></table>
    </div>
    <div class="modal fade" id="modalDisciplina" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="modalTitle">Nova Disciplina</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body"><form id="form"><input type="hidden" id="discId">
            <div class="mb-3"><label class="form-label">Descrição *</label><input type="text" class="form-control" id="discDescricao" required></div>
            <div class="mb-3"><label class="form-label">Carga Horária Anual (h/aula) *</label><input type="number" class="form-control" id="discCarga" min="1" required></div>
        </form></div>
        <div class="modal-footer"><button class="btn-secondary-custom" data-bs-dismiss="modal">Cancelar</button><button class="btn-primary-custom" onclick="salvar()">Salvar</button></div>
    </div></div></div>
    <script src="/js/disciplina.js"></script>
</div></body></html>
